
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEOGrowthers | Tech, AI & Growth</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-black: #000000;
            --bg-card: #121212;
            --border: #222222;
            --text-main: #e1e1e1;
            --text-dim: #888888;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Editorial Typography System */
        .heading-editorial {
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: -0.04em;
            line-height: 0.95;
        }

        .editorial-underline {
            position: relative;
            display: inline-block;
        }
        .editorial-underline::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary);
        }

        /* Master Components Standardization */
        .btn-editorial {
            background-color: var(--primary);
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.75rem 1.5rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
        }
        .btn-editorial:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .card-editorial {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            transition: border-color 0.3s ease;
        }
        .card-editorial:hover {
            border-color: var(--primary);
        }

        /* 3DJuegos-style overlay */
        .img-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* Animation utilities */
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile specific fixes */
        @media (max-width: 640px) {
            .heading-editorial { font-size: 2.25rem !important; }
        }
    </style>
